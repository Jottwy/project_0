# ADR-117: el relay UDP de respaldo es un binario APARTE (D2), así que esto pasa a ser un
# workspace de dos miembros. La raíz sigue siendo `backrooms_server` y `target/` sigue estando
# aquí, o sea que `CopyReleaseBackendToBuild.ps1` y `cargo build --release` no cambian de ruta.
# `cargo test` desde este directorio corre ahora las dos suites, que es lo que se quiere.
[workspace]
members = [".", "relay"]

[package]
name = "backrooms_server"
version = "0.1.0"
edition = "2021"
description = "Backrooms Survival — distributed P2P co-op survival horror backend (Rust)"
authors = ["Backrooms Survival Team"]

[dependencies]
# ─── El relay de respaldo (ADR-117) ───
# Sólo por su `protocol`: el sobre se declara UNA vez y los dos lados lo comparten. Una segunda
# copia del framing aquí se desincronizaría de la del relay sin que nadie lo notase hasta que un
# datagrama dejara de entenderse en producción. La dependencia va en este sentido —el juego usa el
# protocolo del relay— y nunca al revés: el relay no sabe nada del juego (ADR-117 D2).
backrooms_relay = { path = "relay" }

# ─── Async runtime ───
tokio = { version = "1", features = ["full"] }

# ─── Serialization ───
serde = { version = "1", features = ["derive"] }
serde_json = "1"          # JSON save files (human readable)
rmp-serde = "1.3"         # MessagePack for IPC + network (compact, fast)
# ADR-046: `Vec<u8>` alone deserializes ONLY from a msgpack array — a bin payload fails with
# `invalid type: byte array, expected a sequence` (verified, not assumed). serde_bytes is the
# `#[serde(with = ...)]` adapter that maps it to the bin family. No transitive dependencies.
serde_bytes = "0.11"      # opaque byte payloads (voice frames) as msgpack bin, not int arrays

# ─── Logging ───
log = "0.4"
env_logger = "0.11"

# ─── Misc ───
rand = "0.8"                                          # Procedural generation, teleport rolls
uuid = { version = "1", features = ["v4", "serde"] }  # Player UUIDs
chrono = { version = "0.4", features = ["serde"] }    # Timestamps for saves
# P0-3: OS-level exclusive lock (flock/LockFileEx) on the world save — the kernel releases it
# when the process's handles close, crash or kill included, unlike a sentinel file.
fd-lock = "4.0.4"

# P2P networking uses tokio::net::UdpSocket (included in tokio "full").

[profile.release]
opt-level = 3
lto = true
